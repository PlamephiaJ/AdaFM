name: imagenet

# Hugging Face ImageNet-1k (ILSVRC) config
hf_dataset: ILSVRC/imagenet-1k
hf_train_split: train
hf_val_split: validation
hf_cache_dir: null

# Optional cache dir for HF downloads (also used if hf_cache_dir is null)
dataroot: ./data/

download: false
batch_size: 64
image_size: 128

# Cached FID stats (generated by convert_arrow_to_jpg.py)
fid_stats_path: ./data/imagenet/jpg/imagenet_fid_stats_train.npz
fid_batch_size: 64
